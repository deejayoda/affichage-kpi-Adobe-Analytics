<!doctype html><html><head><meta charset="utf-8"><title>Grafana 1</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}
img{width:100%;height:100%;object-fit:contain}
#b{display:none;position:fixed;top:0;left:0;right:0;background:#c62828;color:#fff;
font:bold 26px sans-serif;text-align:center;padding:8px;z-index:9}
#u{position:fixed;right:10px;bottom:6px;color:#9aa;font:14px sans-serif;z-index:9}</style></head>
<body><img id="i" src="capture-1.png"><div id="b"></div><div id="u"></div>
<script>
var IMG="capture-1.png";
function p(n){return (n<10?'0':'')+n}
function tick(){
  document.getElementById('i').src=IMG+'?t='+Date.now();
  fetch('status.json?t='+Date.now(),{cache:'no-store'}).then(function(r){
    var sd=r.headers.get('Date'); var now=sd?new Date(sd).getTime():Date.now();
    return r.json().then(function(s){return [s,now]});
  }).then(function(a){
    var s=a[0], now=a[1], b=document.getElementById('b'), u=document.getElementById('u');
    if(!s.updated){u.textContent='';b.style.display='block';b.textContent='Aucune donnée pour le moment';return;}
    var d=new Date(s.updated*1000), age=now/1000-s.updated;
    u.textContent='MAJ '+p(d.getHours())+':'+p(d.getMinutes());
    if(age>s.stale_after){b.style.display='block';b.textContent='Données non actualisées depuis '+Math.round(age/60)+' min';}
    else b.style.display='none';
  }).catch(function(){});
}
tick(); setInterval(tick,60000);
</script></body></html>
